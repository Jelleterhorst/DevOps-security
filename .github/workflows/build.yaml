name: CI/CD

on: push

jobs:
  
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jelleterhorst/devops-security:latest

  scan:
    name: Scan
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Scout CVE
        uses: docker/scout-action@v1.24.0
        with:
          command: cves
          image: jelleterhorst/devops-security:latest
          only-fixed: true
          only-severities: critical, high
          ignore-base: false
          ignore-unchanged: false
          write-comment: true
          github-token: ${{ secrets.DOCKER_SCOUT_TOKEN }}
#hoi jelle onderstaande 2 commends weghalen als je wilt dat de pipeline stopt bij een vulnerability. laat dit aan denk zien en dan comment weer terug zetten          
          #exit-code: true
          #exit-on: vulnerability

  test:
    name: Test
    needs: [ Scan ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: test 
        run: |
          docker run -d -p 80:5000 jelleterhorst/devops-security:latest
          sleep 10s
          curl http://localhost
          docker ps -aq | xargs docker stop | xargs docker rm

  deploy:
    name: Deploy
    needs: [ test ]
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - run: |
              sudo kubectl delete deployment --all            
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/deployment.yaml --force
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/nginx-service.yaml --force
              sudo kubectl rollout status deployment/devops-jelle --timeout=65s
  postman:
    name: Postman test
    needs: [ Deploy ]
    runs-on: ubuntu-latest
    steps:
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run 58320908-2a010794-fa25-4594-88c5-0768a5a95c0b