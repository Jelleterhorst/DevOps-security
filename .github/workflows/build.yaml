name: CI/CD

on: push

jobs:
  
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jelleterhorst/devops-security:latest

  scan:
    name: Scan
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Docker Scout CVE
        uses: docker/scout-action@v1.24.0
        with:
          command: cves
          image: jelleterhorst/devops-security:latest
          only-fixed: true
          only-severities: critical, high
          ignore-base: false
          ignore-unchanged: false
          write-comment: true
          github-token: ${{ secrets.DOCKER_SCOUT_TOKEN }}
          exit-code: true
          exit-on: vulnerability

  test:
    name: Test
    needs: [ Scan ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: test 
        run: |
          docker run -d -p 80:5000 jelleterhorst/devops-security:latest
          sleep 10s
          curl http://localhost
          docker ps -aq | xargs docker stop | xargs docker rm

  deploy:
    name: Deploy
    needs: [ test ]
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - run: |         
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/deployment.yaml
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/nginx-service.yaml
              sudo kubectl rollout restart deployment devops-jelle